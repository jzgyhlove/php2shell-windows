name: build-and-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PyInstaller
        run: python -m pip install --upgrade pyinstaller

      - name: Self test
        run: python app.py --selftest

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name php2shell_checker --icon app.ico --add-data "app.ico;." app.py

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $version = (Select-String -Path app.py -Pattern 'APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $tag = "v$version"
          $asset = "php2shell_checker-$version.exe"
          Copy-Item "dist/php2shell_checker.exe" $asset
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "Release $tag already exists, updating asset"
            gh release upload $tag $asset --clobber
          } else {
            Write-Host "Creating release $tag"
            gh release create $tag $asset --title $tag --generate-notes --latest
          }
